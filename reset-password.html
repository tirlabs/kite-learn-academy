<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#14213D">
<title>Reset Password | KiteLearn</title>
<style>
:root{--blue:#2563EB;--navy:#14213D;--muted:#64748B;--bg:#F8FAFC}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--navy)}.card{width:100%;max-width:440px;padding:40px 32px;background:#fff;border:1px solid #E2E8F0;border-radius:18px;box-shadow:0 12px 40px rgba(20,33,61,.07)}.brand-logo{display:block;width:190px;height:auto;max-width:100%;margin:0 auto 34px}h1{font-size:25px;margin:0 0 10px;text-align:center}p{color:var(--muted);font-size:14px;line-height:1.6;text-align:center;margin:0 0 24px}input{width:100%;padding:14px;margin:0 0 14px;border:1px solid #CBD5E1;border-radius:8px;font-size:15px}button,.link{display:block;width:100%;padding:14px 18px;border:0;border-radius:9px;background:var(--blue);color:white;font-size:15px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{display:none;margin:16px 0;padding:12px;border-radius:8px;font-size:14px;line-height:1.5}.message.show{display:block}.success{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}.error{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA}.link{margin-top:12px;background:var(--navy)}
</style></head>
<body><main class="card"><img src="kitelearn-logo-final.png" alt="KiteLearn" class="brand-logo"><h1>Choose a New Password</h1><p>Enter a new password for your KiteLearn account. The reset link can only be used once.</p>
<form id="reset-form"><input id="password" type="password" placeholder="New password (8–128 characters)" minlength="8" maxlength="128" autocomplete="new-password" required><input id="confirm" type="password" placeholder="Confirm new password" minlength="8" maxlength="128" autocomplete="new-password" required><div id="message" class="message" role="status"></div><button id="submit" type="submit">Reset Password</button></form><a class="link" href="/">Return to KiteLearn</a></main>
<script>
const params=new URLSearchParams(location.search);let token=params.get("token")||"";const form=document.getElementById("reset-form"),msg=document.getElementById("message"),btn=document.getElementById("submit");
function show(text,type){msg.textContent=text;msg.className="message show "+type;}
if(!token||!/^[A-Za-z0-9_-]{20,200}$/.test(token)){show("This reset link is missing or invalid. Request a new password reset link.","error");btn.disabled=true;}
form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm){show("The passwords do not match.","error");return;}btn.disabled=true;btn.textContent="Updating...";try{const response=await fetch("/api/reset-password",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||"Unable to reset password.");show(data.message,"success");form.querySelectorAll("input").forEach(input=>input.disabled=true);history.replaceState({},document.title,location.pathname);}catch(error){show(error.message,"error");}finally{btn.disabled=false;btn.textContent="Reset Password";}});
</script></body></html>
